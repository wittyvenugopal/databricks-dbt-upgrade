# Local profile for `dbt parse` / dbt-autofix. Parsing never connects, so the defaults are placeholders.
# For dbt build/compile, set DATABRICKS_HOST, DATABRICKS_HTTP_PATH and DATABRICKS_TOKEN.
dbt_upgrade_lab:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'example.cloud.databricks.com') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/none') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'placeholder') }}"
      catalog: workspace
      schema: dbt_upgrade_lab_local
